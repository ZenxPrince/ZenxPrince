
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="420" viewBox="0 0 1500 420">
  <defs>
    <linearGradient id="smoke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#edf2f6" stop-opacity=".48"/>
      <stop offset="18%" stop-color="#bac5cf" stop-opacity=".29"/>
      <stop offset="46%" stop-color="#778490" stop-opacity=".16"/>
      <stop offset="75%" stop-color="#46515d" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#d9e1e8" stop-opacity=".38"/>
    </linearGradient>

    <linearGradient id="reflection" x1="0" y1="0" x2="1" y2=".1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".02"/>
      <stop offset="24%" stop-color="#ffffff" stop-opacity=".30"/>
      <stop offset="48%" stop-color="#dce5ed" stop-opacity=".08"/>
      <stop offset="76%" stop-color="#ffffff" stop-opacity=".19"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".025"/>
    </linearGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f7fa" stop-opacity=".82"/>
      <stop offset="28%" stop-color="#c4d0db" stop-opacity=".20"/>
      <stop offset="65%" stop-color="#748391" stop-opacity=".09"/>
      <stop offset="100%" stop-color="#e6edf4" stop-opacity=".52"/>
    </linearGradient>

    <filter id="optical" x="-20%" y="-30%" width="140%" height="160%">
      <feTurbulence type="fractalNoise"
                    baseFrequency=".012 .035"
                    numOctaves="2"
                    seed="13"
                    result="noise"/>
      <feDisplacementMap in="SourceGraphic"
                         in2="noise"
                         scale="1.4"
                         xChannelSelector="R"
                         yChannelSelector="G"/>
    </filter>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <style>
      .name {
        font-family: "Segoe UI", Arial, sans-serif;
        font-weight: 600;
        letter-spacing: -4px;
      }
      .sub {
        font-family: "Segoe UI", Arial, sans-serif;
        font-weight: 400;
      }
    </style>
  </defs>

  <!-- Golden-ratio aligned typography -->
  <!-- Visual center: x=750, y=210 -->

  <!-- Eyebrow -->
  <text x="750" y="118"
        class="sub"
        font-size="12"
        letter-spacing="5"
        text-anchor="middle"
        fill="#d0d9e1"
        fill-opacity=".52">
    INDEPENDENT ENGINEERING
  </text>

  <!-- Name shadow -->
  <text x="750" y="220"
        class="name"
        font-size="108"
        text-anchor="middle"
        fill="#111820"
        fill-opacity=".25"
        filter="url(#shadow)">
    PRINCE VYAS
  </text>

  <!-- Smoked glass body -->
  <text x="750" y="220"
        class="name"
        font-size="108"
        text-anchor="middle"
        fill="url(#smoke)"
        stroke="#dce5ed"
        stroke-opacity=".26"
        stroke-width=".85">
    PRINCE VYAS
  </text>

  <!-- Internal reflection -->
  <text x="750" y="220"
        class="name"
        font-size="108"
        text-anchor="middle"
        fill="url(#reflection)"
        fill-opacity=".68">
    PRINCE VYAS
  </text>

  <!-- Optical edge -->
  <text x="750" y="220"
        class="name"
        font-size="108"
        text-anchor="middle"
        fill="none"
        stroke="url(#rim)"
        stroke-opacity=".48"
        stroke-width=".55">
    PRINCE VYAS
  </text>

  <!-- Accent -->
  <rect x="714" y="250" width="72" height="1.4"
        rx="1"
        fill="#dce5ed"
        fill-opacity=".44"/>

  <!-- Descriptor -->
  <text x="750" y="290"
        class="sub"
        font-size="18"
        letter-spacing="4"
        text-anchor="middle"
        fill="#c5d0da"
        fill-opacity=".54">
    AI  /  SYSTEMS  /  TECHNOLOGY
  </text>

  <!-- Secondary line -->
  <text x="750" y="326"
        class="sub"
        font-size="14"
        letter-spacing="2"
        text-anchor="middle"
        fill="#c5d0da"
        fill-opacity=".38">
    Building · Exploring · Engineering
  </text>
</svg>
