
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="420" viewBox="0 0 1500 420">
  <defs>
    <linearGradient id="smoke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="22%" stop-color="#eaf4ff" stop-opacity="0.76"/>
      <stop offset="50%" stop-color="#b9cbdc" stop-opacity="0.48"/>
      <stop offset="78%" stop-color="#e2edf7" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#8195a8" stop-opacity="0.24"/>
    </linearGradient>

    <linearGradient id="reflection" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="18%" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="34%" stop-color="#c5e7ff" stop-opacity="0.16"/>
      <stop offset="52%" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="72%" stop-color="#b6d9f2" stop-opacity="0.22"/>
      <stop offset="88%" stop-color="#ffffff" stop-opacity="0.56"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#d9edff" stop-opacity="0.48"/>
      <stop offset="55%" stop-color="#a7bfd4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.82"/>
    </linearGradient>

    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.22"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <style>
    .name {
      font-family: "Segoe UI", Arial, sans-serif;
      font-weight: 600;
      letter-spacing: -5px;
    }

    .sub {
      font-family: "Segoe UI", Arial, sans-serif;
      font-weight: 400;
    }
  </style>

  <!-- Upper label -->
  <text x="700" y="92"
        text-anchor="middle"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="19"
        letter-spacing="6"
        fill="#d0d9e1"
        opacity="0.58">
    INDEPENDENT ENGINEERING
  </text>

  <!-- Soft shadow -->
  <text x="700" y="205"
        text-anchor="middle"
        class="name"
        font-size="142"
        fill="#101923"
        opacity="0.32"
        filter="url(#shadow)">
    PRINCE V<tspan dx="12">YAS</tspan>
  </text>

  <!-- Glass body -->
  <text x="700" y="205"
        text-anchor="middle"
        class="name"
        font-size="142"
        fill="url(#smoke)"
        stroke="#dceeff"
        stroke-opacity="0.38"
        stroke-width="1.2">
    PRINCE V<tspan dx="12">YAS</tspan>
  </text>

  <!-- Refractive reflection -->
  <text x="700" y="205"
        text-anchor="middle"
        class="name"
        font-size="142"
        fill="url(#reflection)"
        opacity="0.85">
    PRINCE V<tspan dx="12">YAS</tspan>
  </text>

  <!-- Edge refraction -->
  <text x="700" y="205"
        text-anchor="middle"
        class="name"
        font-size="142"
        fill="none"
        stroke="url(#rim)"
        stroke-width="1"
        opacity="0.8">
    PRINCE V<tspan dx="12">YAS</tspan>
  </text>

  <!-- Specular highlights -->
  <text x="700" y="205"
        text-anchor="middle"
        class="name"
        font-size="142"
        fill="none"
        stroke="url(#shine)"
        stroke-width="0.5"
        opacity="0.8"
        filter="url(#glow)">
    PRINCE V<tspan dx="12">YAS</tspan>
  </text>

  <!-- Accent -->
  <rect x="702" y="239" width="76" height="2"
        fill="#dce5ed" opacity="0.4"/>

  <!-- Descriptor -->
  <text x="700" y="295"
        text-anchor="middle"
        class="sub"
        font-size="26"
        letter-spacing="5"
        fill="#dce5ed"
        opacity="0.76">
    AI  /  SYSTEMS  /  TECHNOLOGY
  </text>

  <!-- Secondary line -->
  <text x="700" y="352"
        text-anchor="middle"
        class="sub"
        font-size="21"
        letter-spacing="2.5"
        fill="#dce5ed"
        opacity="0.52">
    Building · Exploring · Engineering
  </text>
</svg>
