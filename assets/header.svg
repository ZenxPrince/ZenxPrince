<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="420" viewBox="0 0 1500 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090b"/>
      <stop offset=".48" stop-color="#111316"/>
      <stop offset="1" stop-color="#070809"/>
    </linearGradient>

    <radialGradient id="ambient" cx="52%" cy="42%" r="70%">
      <stop offset="0" stop-color="#34383c" stop-opacity=".45"/>
      <stop offset=".45" stop-color="#181a1d" stop-opacity=".2"/>
      <stop offset="1" stop-color="#050607" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".105"/>
      <stop offset=".25" stop-color="#c9cdd2" stop-opacity=".035"/>
      <stop offset=".65" stop-color="#8c939b" stop-opacity=".018"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".065"/>
    </linearGradient>

    <linearGradient id="glassHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".28" stop-color="#ffffff" stop-opacity=".15"/>
      <stop offset=".7" stop-color="#dce1e7" stop-opacity=".035"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="text" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9dcdf"/>
      <stop offset=".45" stop-color="#aeb3b8"/>
      <stop offset="1" stop-color="#71777d"/>
    </linearGradient>

    <linearGradient id="muted" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8c9298"/>
      <stop offset="1" stop-color="#555a60"/>
    </linearGradient>

    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="65"/>
    </filter>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <clipPath id="clip">
      <rect width="1500" height="420" rx="30"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <!-- Background -->
    <rect width="1500" height="420" fill="url(#bg)"/>
    <rect width="1500" height="420" fill="url(#ambient)"/>

    <!-- Atmosphere -->
    <ellipse cx="1060" cy="170" rx="350" ry="190"
             fill="#6c747b" opacity=".13" filter="url(#blur)"/>
    <ellipse cx="310" cy="330" rx="390" ry="150"
             fill="#24282c" opacity=".32" filter="url(#blur)"/>

    <!-- Floating glass forms -->
    <g opacity=".78">
      <rect x="1000" y="-65" width="330" height="260" rx="100"
            transform="rotate(22 1165 65)"
            fill="url(#glass)" />

      <rect x="1080" y="-65" width="330" height="260" rx="100"
            transform="rotate(22 1245 65)"
            fill="none" stroke="#ffffff" stroke-opacity=".07" stroke-width="1.2"/>

      <rect x="1170" y="130" width="230" height="210" rx="80"
            transform="rotate(-25 1285 235)"
            fill="url(#glass)" />

      <rect x="1170" y="130" width="230" height="210" rx="80"
            transform="rotate(-25 1285 235)"
            fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="1.2"/>
    </g>

    <!-- Glass plane -->
    <rect x="74" y="58" width="1352" height="304" rx="36"
          fill="url(#glass)"/>

    <rect x="74" y="58" width="1352" height="304" rx="36"
          fill="none" stroke="#ffffff" stroke-opacity=".075" stroke-width="1.1"/>

    <rect x="75" y="59" width="1350" height="2" rx="1"
          fill="url(#glassHighlight)" opacity=".7"/>

    <!-- Inner light reflection -->
    <path d="M110 90 Q400 45 720 85 T1350 90"
          fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1.2"/>

    <!-- Small technical marker -->
    <circle cx="133" cy="126" r="3" fill="#a7adb3" opacity=".8"/>

    <text x="151" y="131"
          font-family="Segoe UI, Arial, sans-serif"
          font-size="11" letter-spacing="4"
          fill="#858b91">
      INDEPENDENT ENGINEERING
    </text>

    <!-- Main typography -->
    <text x="132" y="220"
          font-family="Segoe UI, Arial, sans-serif"
          font-size="65" font-weight="600"
          letter-spacing="-2.8"
          fill="url(#text)">
      PRINCE VYAS
    </text>

    <!-- Accent line -->
    <rect x="134" y="246" width="68" height="1.5"
          rx="1" fill="#a4abb1" opacity=".62"/>

    <!-- Descriptor -->
    <text x="132" y="281"
          font-family="Segoe UI, Arial, sans-serif"
          font-size="15" font-weight="400"
          letter-spacing="3.1"
          fill="#8b9197">
      AI  /  SYSTEMS  /  TECHNOLOGY
    </text>

    <!-- Secondary line -->
    <text x="132" y="315"
          font-family="Segoe UI, Arial, sans-serif"
          font-size="12" letter-spacing="1.5"
          fill="#646a70">
      Building · Exploring · Engineering
    </text>

    <!-- Right-side spatial element -->
    <g transform="translate(1190 210)">
      <circle r="105" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="1"/>
      <circle r="82" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
      <circle r="60" fill="none" stroke="#ffffff" stroke-opacity=".065" stroke-width="1"/>

      <ellipse rx="105" ry="42" transform="rotate(-35)"
               fill="none" stroke="#b5bcc3" stroke-opacity=".09" stroke-width="1"/>

      <ellipse rx="105" ry="42" transform="rotate(35)"
               fill="none" stroke="#b5bcc3" stroke-opacity=".06" stroke-width="1"/>

      <circle r="27" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".13"/>
      <circle r="13" fill="#c6ccd1" opacity=".12" filter="url(#softShadow)"/>
      <circle r="4" fill="#d4d8dc" opacity=".75"/>
    </g>

    <!-- Corner details -->
    <text x="1334" y="325"
          font-family="Segoe UI, Arial, sans-serif"
          font-size="10" letter-spacing="2"
          text-anchor="end"
          fill="#63696f">
      01 / SYSTEMS
    </text>

    <!-- Bottom fade -->
    <rect x="74" y="352" width="1352" height="10"
          fill="#050607" opacity=".15"/>
  </g>
</svg>
