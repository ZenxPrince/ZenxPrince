
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="420" viewBox="0 0 1500 420">
  <defs>
    <linearGradient id="smoke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#edf2f6" stop-opacity=".52"/>
      <stop offset="18%" stop-color="#bac5cf" stop-opacity=".31"/>
      <stop offset="46%" stop-color="#778490" stop-opacity=".17"/>
      <stop offset="75%" stop-color="#46515d" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#d9e1e8" stop-opacity=".40"/>
    </linearGradient>

    <linearGradient id="reflection" x1="0" y1="0" x2="1" y2=".1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".02"/>
      <stop offset="24%" stop-color="#ffffff" stop-opacity=".32"/>
      <stop offset="48%" stop-color="#dce5ed" stop-opacity=".08"/>
      <stop offset="76%" stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".025"/>
    </linearGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f7fa" stop-opacity=".85"/>
      <stop offset="28%" stop-color="#c4d0db" stop-opacity=".20"/>
      <stop offset="65%" stop-color="#748391" stop-opacity=".09"/>
      <stop offset="100%" stop-color="#e6edf4" stop-opacity=".55"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <style>
      .name {
        font-family: "Segoe UI", Arial, sans-serif;
        font-weight: 600;
        letter-spacing: -5px;
      }
      .sub {
        font-family: "Segoe UI", Arial, sans-serif;
        font-weight: 400;
      }
    </style>
  </defs>

  <!-- Optical center: shifted right, oversized composition -->

  <!-- Upper label -->
  <text x="850" y="92"
        class="sub"
        font-size="19"
        letter-spacing="6"
        text-anchor="middle"
        fill="#d0d9e1"
        fill-opacity=".58">
    INDEPENDENT ENGINEERING
  </text>

  <!-- Name shadow -->
  <text x="850" y="205"
        class="name"
        font-size="142"
        text-anchor="middle"
        fill="#111820"
        fill-opacity=".24"
        filter="url(#shadow)">
    PRINCE VYAS
  </text>

  <!-- Glass body -->
  <text x="850" y="205"
        class="name"
        font-size="142"
        text-anchor="middle"
        fill="url(#smoke)"
        stroke="#dce5ed"
        stroke-opacity=".29"
        stroke-width=".95">
    PRINCE VYAS
  </text>

  <!-- Reflection -->
  <text x="850" y="205"
        class="name"
        font-size="142"
        text-anchor="middle"
        fill="url(#reflection)"
        fill-opacity=".7">
    PRINCE VYAS
  </text>

  <!-- Glass edge -->
  <text x="850" y="205"
        class="name"
        font-size="142"
        text-anchor="middle"
        fill="none"
        stroke="url(#rim)"
        stroke-opacity=".5"
        stroke-width=".6">
    PRINCE VYAS
  </text>

  <!-- Accent -->
  <rect x="812" y="239" width="76" height="2"
        rx="1"
        fill="#dce5ed"
        fill-opacity=".52"/>

  <!-- Main descriptor -->
  <text x="850" y="295"
        class="sub"
        font-size="26"
        letter-spacing="5"
        text-anchor="middle"
        fill="#c5d0da"
        fill-opacity=".62">
    AI  /  SYSTEMS  /  TECHNOLOGY
  </text>

  <!-- Secondary line -->
  <text x="850" y="352"
        class="sub"
        font-size="21"
        letter-spacing="2.5"
        text-anchor="middle"
        fill="#c5d0da"
        fill-opacity=".45">
    Building · Exploring · Engineering
  </text>
</svg>
