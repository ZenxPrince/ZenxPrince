<svg xmlns="http://www.w3.org/2000/svg" width="800" height="120" viewBox="0 0 800 120" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <filter id="blur1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
    </filter>
    <filter id="glass" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d0d1a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.07"/>
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.03"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.06"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.25"/>
      <stop offset="40%" style="stop-color:#ff3b3b;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.1"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="45%" style="stop-color:#e8e8e8;stop-opacity:1"/>
      <stop offset="55%" style="stop-color:#ff4444;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#cc2222;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff3b3b;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#ff3b3b;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#ff3b3b;stop-opacity:0"/>
    </linearGradient>
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff3b3b;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ff3b3b;stop-opacity:0"/>
    </radialGradient>
    <clipPath id="roundedClip">
      <rect x="40" y="20" width="720" height="80" rx="20" ry="20"/>
    </clipPath>
  </defs>

  <!-- Dark background -->
  <rect width="800" height="120" fill="url(#bgGrad)"/>

  <!-- Glow behind glass -->
  <ellipse cx="400" cy="60" rx="300" ry="40" fill="url(#glowCenter)" filter="url(#blur1)"/>

  <!-- Glass panel backdrop blur simulation -->
  <rect x="40" y="20" width="720" height="80" rx="20" ry="20"
        fill="#111118" opacity="0.6"/>

  <!-- Glass fill -->
  <rect x="40" y="20" width="720" height="80" rx="20" ry="20"
        fill="url(#glassGrad)"/>

  <!-- Glass border -->
  <rect x="40" y="20" width="720" height="80" rx="20" ry="20"
        fill="none" stroke="url(#borderGrad)" stroke-width="1.2" opacity="0.9"/>

  <!-- Inner top highlight (light refraction) -->
  <rect x="42" y="21" width="716" height="2" rx="1" fill="white" opacity="0.08"
        clip-path="url(#roundedClip)"/>

  <!-- Bottom inner edge -->
  <rect x="42" y="97" width="716" height="1.5" rx="1" fill="white" opacity="0.04"
        clip-path="url(#roundedClip)"/>

  <!-- Red accent glow line under text -->
  <rect x="160" y="93" width="480" height="1" rx="1" fill="url(#glowGrad)" opacity="0.8"/>

  <!-- Main text: I'm Prince. -->
  <text x="400" y="73"
        font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="38"
        font-weight="800"
        letter-spacing="-1"
        text-anchor="middle"
        fill="url(#textGrad)">I'm Prince.</text>

  <!-- Subtle text shadow layer -->
  <text x="401" y="74"
        font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="38"
        font-weight="800"
        letter-spacing="-1"
        text-anchor="middle"
        fill="#ff3b3b"
        opacity="0.15">I'm Prince.</text>

  <!-- Left glare highlight on glass -->
  <ellipse cx="120" cy="45" rx="60" ry="15" fill="white" opacity="0.025"
           clip-path="url(#roundedClip)"/>

<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
