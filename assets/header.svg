
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="420" viewBox="0 0 1500 420">
  <defs>
    <linearGradient id="smoke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="40%" stop-color="#dce5ee" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#8b9ba9" stop-opacity="0.32"/>
    </linearGradient>

    <linearGradient id="reflection" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#cce4f5" stop-opacity="0.18"/>
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#c9d8e6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.65"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <style>
    .name {
      font-family: "Segoe UI", Arial, sans-serif;
      font-weight: 600;
      letter-spacing: -5px;
    }

    .sub {
      font-family: "Segoe UI", Arial, sans-serif;
      font-weight: 400;
    }
  </style>

  <!-- Upper label -->
  <text x="810" y="92"
        text-anchor="middle"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="19"
        letter-spacing="6"
        fill="#d0d9e1"
        opacity="0.58">
    INDEPENDENT ENGINEERING
  </text>

  <!-- Soft shadow -->
  <text x="810" y="205"
        text-anchor="middle"
        class="name"
        font-size="142"
        fill="#111820"
        opacity="0.24"
        filter="url(#shadow)">
    PRINCE V<tspan dx="12">YAS</tspan>
  </text>

  <!-- Main translucent glass text -->
  <text x="810" y="205"
        text-anchor="middle"
        class="name"
        font-size="142"
        fill="url(#smoke)"
        stroke="#dce5ed"
        stroke-opacity="0.29"
        stroke-width="1">
    PRINCE V<tspan dx="12">YAS</tspan>
  </text>

  <!-- Glass reflection -->
  <text x="810" y="205"
        text-anchor="middle"
        class="name"
        font-size="142"
        fill="url(#reflection)"
        opacity="0.7">
    PRINCE V<tspan dx="12">YAS</tspan>
  </text>

  <!-- Glass edge -->
  <text x="810" y="205"
        text-anchor="middle"
        class="name"
        font-size="142"
        fill="none"
        stroke="url(#rim)"
        stroke-width="0.7"
        opacity="0.5">
    PRINCE V<tspan dx="12">YAS</tspan>
  </text>

  <!-- Accent -->
  <rect x="772" y="239" width="76" height="2"
        fill="#dce5ed" opacity="0.35"/>

  <!-- Descriptor -->
  <text x="810" y="295"
        text-anchor="middle"
        class="sub"
        font-size="26"
        letter-spacing="5"
        fill="#dce5ed"
        opacity="0.72">
    AI  /  SYSTEMS  /  TECHNOLOGY
  </text>

  <!-- Secondary line -->
  <text x="810" y="352"
        text-anchor="middle"
        class="sub"
        font-size="21"
        letter-spacing="2.5"
        fill="#dce5ed"
        opacity="0.48">
    Building · Exploring · Engineering
  </text>
</svg>
